<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Cloud9 mark on night navy: the cloud alone. Its face (components/ui/BrandMark.tsx) only reads from 24px up, so the tab icon leaves it off. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a58"/>
      <stop offset="1" stop-color="#0b1a2c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#sky)"/>
  <g transform="translate(-3.84 -3.84) scale(1.12)">
    <circle cx="39" cy="27" r="13" fill="#f3f6f9"/>
    <circle cx="18" cy="33" r="10" fill="#f3f6f9"/>
    <circle cx="14" cy="43" r="6" fill="#f3f6f9"/>
    <circle cx="49" cy="41.5" r="7.5" fill="#f3f6f9"/>
    <rect x="14" y="33" width="35" height="16" fill="#f3f6f9"/>
  </g>
</svg>
