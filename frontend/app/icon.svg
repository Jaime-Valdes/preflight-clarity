<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Pre-Flight Clarity mark: a plane climbing over a sea-glass horizon on night navy. Drawn to stay legible at 16px. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a58"/>
      <stop offset="1" stop-color="#0b1a2c"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bdac9"/>
      <stop offset="1" stop-color="#3c9e89"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="64" height="64" rx="15"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#sky)"/>
  <g clip-path="url(#tile)">
    <circle cx="32" cy="92" r="52" fill="url(#sea)"/>
  </g>
  <g fill="#f3f6f9">
    <rect x="28.5" y="8" width="7" height="34" rx="3.5"/>
    <path d="M32 19 L9 34 V39.5 L32 32.5 L55 39.5 V34 Z"/>
    <path d="M32 35.5 L22.5 43 V46.5 L32 44 L41.5 46.5 V43 Z"/>
  </g>
</svg>
